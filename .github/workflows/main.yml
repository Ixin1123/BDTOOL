name: 打包 Windows EXE

on:
  push:
    branches: [ "main" ]  
  workflow_dispatch:      

jobs:
  build:
    runs-on: windows-latest  

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: 安装依赖库
      run: |
        python -m pip install --upgrade pip
        pip install matplotlib pyinstaller

    - name: 安装 UPX (用于压缩体积)
      run: |
        choco install upx  # GitHub 的 Windows 环境内置了 choco 包管理器

    - name: 使用 PyInstaller + UPX 打包
      run: |
        # PyInstaller 会自动寻找系统路径中的 upx.exe 进行压缩
        python -m PyInstaller -F -w -i "logo.ico" BDtool.py BDtool.py

    - name: 上传生成的 EXE 文件
      uses: actions/upload-artifact@v4
      with:
        name: BD_Evidence_Tool_Compressed
        path: dist/*.exe
