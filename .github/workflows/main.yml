name: 打包 Windows EXE

on:
  push:
    branches: [ "main" ]  # 当你上传代码到 main 分支时自动触发
  workflow_dispatch:      # 允许手动触发打包

jobs:
  build:
    runs-on: windows-latest  # 使用 Windows 服务器运行

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 设置 Python 3.8  # 关键：强制使用 3.8 版本以兼容 Win7
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: 安装依赖库
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 使用 PyInstaller 打包
      run: |
        pyinstaller -F -w BDtool.py

    - name: 上传生成的 EXE 文件
      uses: actions/upload-artifact@v3
      with:
        name: Beidou_Tool_Win7_Compatible  # 下载时的压缩包名字
        path: dist/*.exe                    # 打包出来的文件路径
