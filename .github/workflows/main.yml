name: 打包 Windows EXE

on:
  push:
    branches: [ "main" ]  
  workflow_dispatch:      

jobs:
  build:
    runs-on: windows-latest  

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: 强制安装依赖库 (直接安装，无需 requirements.txt)
      run: |
        python -m pip install --upgrade pip
        pip install matplotlib pyinstaller

    - name: 使用 PyInstaller 打包 (使用 python -m 调用防报错)
      run: |
        python -m PyInstaller -F -w BDtool.py

    - name: 上传生成的 EXE 文件
      uses: actions/upload-artifact@v4
      with:
        name: BD_Evidence_Tool_Compatible
        path: dist/*.exe
